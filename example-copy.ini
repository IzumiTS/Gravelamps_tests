[output]
outdir = link-point-mass2
label = link-point-mass2
logging_level = INFO

[lens]

data_generation_kwargs = {'geo_switch': 1000, 'precision': 2048}

length_dimensionless_frequency = 20000

length_source_position = 1000

maximum_dimensionless_frequency = 2000

maximum_source_position = 3.0

minimum_dimensionless_frequency = 0.01

minimum_source_position = 0.01

module = gravelamps.models.isolated_point

use_redshifted_lens_mass = True


[scheduler]
scheduler = condor

[scheduler.condor]
request_cpus = 16
request_memory = 16 GB
request_disk = 10 GB
accounting_group = ligo.prod.o4.cbc.lensing.multi
accounting_group_user = izumitakimoto.schmiegelow
transfer_files = True
MY.flock_local = True
requirements = (HAS_SINGULARITY=?=True)
universe = container
transfer_executable = False
use_oauth_services = scitokens
container_image = osdf:///igwn/cit/staging/lensing.o4/lensingflow-gwtc5.sif
executable = /opt/conda/envs/LensingFlow/bin/gravelamps_generate_lens


[run]
local = False
no_analysis_generation = False
number_generation_jobs = 1

[bilby]
