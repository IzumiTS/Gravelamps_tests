[prior]
chirp_mass = bilby.gw.prior.UniformInComponentsChirpMass(name="chirp_mass", latex_label='$\\mathcal{M}$', maximum=194.62307527305077, minimum=68.25578738484073, unit='$M_\\{\\{\\odot\\}\\}$')
dec = bilby.core.prior.analytical.Cosine(name="dec", latex_label='$\\mathrm{DEC}$', maximum=1.5707963267948966, minimum=-1.5707963267948966)
luminosity_distance = bilby.gw.prior.UniformSourceFrame(name="luminosity_distance", cosmology='Planck15_LAL', latex_label='$d_L$', maximum=10000.0, minimum=10.0, unit='Mpc')
mass_1 = bilby.core.prior.base.Constraint(name="mass_1", latex_label='$m_1$', maximum=1000, minimum=1)
mass_2 = bilby.core.prior.base.Constraint(name="mass_2", latex_label='$m_2$', maximum=1000, minimum=1)
mass_ratio = bilby.gw.prior.UniformInComponentsMassRatio(name="mass_ratio", equal_mass=False, latex_label='$q$', maximum=1.0, minimum=0.1087)
phase = bilby.core.prior.analytical.Uniform(name="phase", boundary='periodic', latex_label='$\\phi$', maximum=6.283185307179586, minimum=0)
phi_12 = bilby.core.prior.analytical.Uniform(name="phi_12", boundary='periodic', latex_label='$\\Delta\\phi$', maximum=6.283185307179586, minimum=0)
phi_jl = bilby.core.prior.analytical.Uniform(name="phi_jl", boundary='periodic', latex_label='$\\phi_{JL}$', maximum=6.283185307179586, minimum=0)
psi = bilby.core.prior.analytical.Uniform(name="psi", boundary='periodic', latex_label='$\\psi$', maximum=3.141592653589793, minimum=0)
ra = bilby.core.prior.analytical.Uniform(name="ra", boundary='periodic', latex_label='$\\mathrm{RA}$', maximum=6.283185307179586, minimum=0)
a_1 = bilby.core.prior.analytical.Uniform(name="a_1", latex_label='$a_1$', maximum=0.99, minimum=0)
a_2 = bilby.core.prior.analytical.Uniform(name="a_2", latex_label='$a_2$', maximum=0.99, minimum=0)
theta_jn = bilby.core.prior.analytical.Sine(name="theta_jn", latex_label='$\\theta_{JN}$', maximum=3.141592653589793, minimum=0)
tilt_1 = bilby.core.prior.analytical.Sine(name="tilt_1", latex_label='$\\theta_1$', maximum=3.141592653589793, minimum=0)
tilt_2 = bilby.core.prior.analytical.Sine(name="tilt_2", latex_label='$\\theta_2$', maximum=3.141592653589793, minimum=0)
redshifted_lens_mass = LogUniform(name="redshifted_lens_mass", maximum=10000, minimum=1)
source_position = PowerLaw(name="source_position", alpha=1, maximum=3.0, minimum=0.1)
